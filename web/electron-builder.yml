appId: com.prosa.app
productName: Prosa
copyright: Prosa
asar: true

directories:
  output: ../release

files:
  - desktop/**
  - dist/**
  - package.json

mac:
  icon: build/icon.icns
  category: public.app-category.social-networking
  target: dmg
  identity: null        # ad-hoc/skip signing — configurar Developer ID para distribuição pública
  entitlements: build/entitlements.plist
  entitlementsInherit: build/entitlements.plist
  extendInfo:
    NSMicrophoneUsageDescription: O Prosa usa o microfone para transmitir sua voz nas chamadas.
  artifactName: Prosa-${version}-${arch}.${ext}
  minimumSystemVersion: "11.0"

dmg:
  artifactName: Prosa-${version}-${arch}.${ext}
  window:
    width: 540
    height: 380

win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: Prosa-${version}-${arch}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Prosa

linux:
  icon: build/icon.png
  target: deb
  category: Network
  maintainer: Prosa <contato@prosa.app>
  artifactName: Prosa-${version}-${arch}.${ext}
