
name: Conteúdo de release

on:
  release:
    types: [published, edited, released, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release a reprocessar (ex.: v0.6.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch principal
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Gerar conteúdo da release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/generate-release-content.mjs "$INPUT_TAG"
          else
            node scripts/generate-release-content.mjs
          fi

      - name: Commit e push do conteúdo
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$(git status --porcelain content/)" ]; then
            echo "Nenhuma alteração de conteúdo."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/releases/
          git commit -m "chore(content): release ${RELEASE_TAG}"

          git push origin HEAD:main
